name: Render social preview image
on:
  push:
    paths:
      - .github/workflows/render-social-preview.yml
      - scripts/render_social_preview.py
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Render branded image
        run: python scripts/render_social_preview.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview-furry-extraordinaire.jpg
          git diff --cached --quiet || git commit -m "Publish updated Sir Aster social card"
          git push
