name: Refresh YouTube videos and Shorts

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled jobs can be delayed; 30-minute target, not real time.
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: youtube-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube tab extractor
        run: python -m pip install --disable-pip-version-check 'yt-dlp==2026.8.19'
      - name: Refresh videos and Shorts from official channel tabs
        run: python scripts/update_youtube.py
      - name: Commit changes only when data differs
        run: |
          if ! git diff --quiet -- data/latest.json || [ -n "$(git ls-files --others --exclude-standard -- data/latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/latest.json
            git commit -m "Refresh recent public YouTube videos"
            git push
          else
            echo "No new public videos"
          fi
