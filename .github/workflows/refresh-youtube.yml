name: Refresh YouTube videos and Shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A feed-only commit must not start another extraction run.
    paths:
      - "scripts/update_youtube.py"
      - "tests/test_update_youtube.py"
      - ".github/workflows/refresh-youtube.yml"
  schedule:
    # Staggered attempts improve resilience to skipped schedule events.
    # GitHub can still delay or drop runs: no strict 15-minute SLA.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: youtube-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube tab extractor
        run: python -m pip install --disable-pip-version-check 'yt-dlp==2026.8.19'
      - name: Verify playlist selection and feed behavior
        run: python -m unittest discover -s tests -p "test_update_youtube.py" -v
      - name: Refresh videos and Shorts from official channel tabs
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_youtube.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "YouTube fetch failed on attempt $attempt; retrying in 25 seconds"
              sleep 25
            fi
          done
          exit 1
      - name: Commit changes only when data differs
        run: |
          if ! git diff --quiet -- data/latest.json || [ -n "$(git ls-files --others --exclude-standard -- data/latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/latest.json
            git commit -m "Refresh recent public YouTube videos"
            # Rebase onto any harmless website changes made during extraction.
            # A real data-file conflict still fails safely rather than overwriting.
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new public videos"
          fi
