name: Finish privacy cleanup for feature branches (one-time)
on:
  push:
    paths:
      - .github/workflows/sanitize-feature-history.yml
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Rewrite all five branch refs and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --no-single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in feature/asterdab-cartridge-welcome feature/live-youtube-twitch-previews feature/png-cartridge-logos feature/separate-video-shorts-feeds; do
            git branch "$branch" "refs/remotes/origin/$branch"
          done
          git checkout main
          git rm .github/workflows/sanitize-feature-history.yml
          git commit -m "Remove completed privacy-maintenance workflow"
          python -m pip install --quiet git-filter-repo
          git filter-repo --force --email-callback 'return b"noreply@users.noreply.github.com" if email.lower() == b"sirasterthecat@gmail.com" else email'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for branch in feature/asterdab-cartridge-welcome feature/live-youtube-twitch-previews feature/png-cartridge-logos feature/separate-video-shorts-feeds main; do
            git push --force origin "$branch:refs/heads/$branch"
          done
          echo "Five branches rewritten. Archived PR refs may remain publicly accessible."
